apiVersion: apiregistration.k8s.io/v1
kind: APIService
metadata:
  name: v1alpha1.{{ include "porkbun-webhook.groupName" . }}
  labels:
    {{- include "porkbun-webhook.labels" . | nindent 4 }}
  annotations:
    cert-manager.io/inject-ca-from: "{{ .Release.Namespace }}/{{ include "porkbun-webhook.servingCertificate" . }}"
spec:
  group: {{ include "porkbun-webhook.groupName" . }}
  groupPriorityMinimum: 1000
  versionPriority: 15
  service:
    name: {{ include "porkbun-webhook.fullname" . }}
    namespace: {{ .Release.Namespace }}
    port: {{ .Values.service.port }}
  version: v1alpha1
